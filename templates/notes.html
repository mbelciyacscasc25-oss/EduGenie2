<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes Summarizer | EduGenie</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/notes.css') }}">

</head>

<body>

<nav>

    <div class="logo">
        🎓 EduGenie
    </div>

    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</nav>


<main class="notes-container">

    <h1>📄 Notes Summarizer</h1>

    <p>
        Upload a PDF and get a simple summary.
    </p>


    <form method="POST"
          action="{{ url_for('summarize_pdf') }}"
          enctype="multipart/form-data">

        <input
            type="file"
            name="pdf"
            accept=".pdf"
            required
        >

        <button type="submit">
            Summarize PDF 🚀
        </button>

    </form>


    {% if summary %}

    <div class="summary-box">

        <h2>📚 Summary</h2>

        <p>
            {{ summary }}
        </p>

    </div>

    {% endif %}


    {% if error %}

    <div class="error-box">

        {{ error }}

    </div>

    {% endif %}

</main>

</body>

</html>
